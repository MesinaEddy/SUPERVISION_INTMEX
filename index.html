<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUPERVISION INTMEX - Panel Ejecutivo</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        #map { height: 450px; border-radius: 0.5rem; }
        .signature-pad { border: 2px dashed #4b5563; background: #0f172a; border-radius: 0.5rem; cursor: crosshair; touch-action: none; }
        @media print {
            body { background: white !important; color: black !important; }
            .no-print, header, nav, button, select, input { display: none !important; }
            .print-container { background: white !important; color: black !important; border: none !important; box-shadow: none !important; }
            .print-only { display: block !important; }
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen pb-28">

    <!-- Header -->
    <header class="no-print bg-slate-800 border-b border-slate-700 py-3 px-6 shadow-md">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 rounded-full bg-blue-600 flex items-center justify-center text-white font-bold text-lg shadow border-2 border-blue-400">
                    INT
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-wide text-blue-400">SUPERVISION INTMEX</h1>
                    <p class="text-xs text-slate-400">Control de Campo y Auditoría</p>
                </div>
            </div>
            <div class="flex items-center gap-2 mt-2 md:mt-0 flex-wrap">
                <div id="gps-status" class="bg-emerald-900/60 border border-emerald-500 text-emerald-300 text-xs px-3 py-1.5 rounded-full flex items-center gap-2">
                    <i class="fa-solid fa-location-dot animate-pulse"></i> GPS Activo
                </div>
            </div>
        </div>
    </header>

    <!-- 1. DATOS DE RUTA -->
    <section class="no-print max-w-7xl mx-auto px-4 mt-6">
        <div class="bg-slate-800/90 border border-slate-700 rounded-xl p-4 shadow-lg">
            <div class="flex justify-between items-center mb-3 border-b border-slate-700 pb-2">
                <h2 class="text-sm font-semibold text-blue-300 uppercase tracking-wider flex items-center gap-2">
                    <i class="fa-solid fa-id-card"></i> 1. Datos de Ruta y Asesor (Fijos)
                </h2>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-5 gap-3">
                <div>
                    <label class="block text-xs text-slate-400 mb-1">CEDIS</label>
                    <select id="f-cedis" onchange="onCedisChange()" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-slate-200">
                        <option value="">Seleccione CEDIS</option>
                        <option value="TIJ">TIJUANA</option>
                        <option value="MXLI">MEXICALI</option>
                        <option value="HILLO">HERMOSILLO</option>
                        <option value="MOC">MOCHIS</option>
                        <option value="CUL">CULIACAN</option>
                        <option value="MZT">MAZATLAN</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Ruta</label>
                    <select id="f-ruta" onchange="saveRouteData()" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-slate-200">
                        <option value="">Primero seleccione un CEDIS</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Nombre del Asesor</label>
                    <input type="text" id="f-asesor" placeholder="Ej. Carlos Gutiérrez" oninput="saveRouteData()" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-slate-200">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Tipo de Ruta</label>
                    <select id="f-tipo-ruta" onchange="saveRouteData()" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-slate-200">
                        <option value="Ruta Activa">Ruta Activa</option>
                        <option value="Ruta Nueva">Ruta Nueva</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Objetivo de Supervisión</label>
                    <select id="f-objetivo" onchange="saveRouteData()" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-slate-200">
                        <option value="Venta">Venta</option>
                        <option value="Capacitación">Capacitación</option>
                        <option value="Territorio">Territorio</option>
                    </select>
                </div>
            </div>
        </div>
    </section>

    <!-- CONTENEDOR PRINCIPAL -->
    <main class="max-w-7xl mx-auto px-4 mt-6">

        <!-- TAB 1: CLIENTES -->
        <div id="tab-clientes" class="tab-content bg-slate-800 border border-slate-700 rounded-xl p-6 shadow-xl block">
            <h2 class="text-lg font-semibold text-blue-400 mb-4 flex items-center gap-2">
                <i class="fa-solid fa-user-plus"></i> 2. Alta de Cliente en Base de Datos
            </h2>
            <form id="client-form" onsubmit="registerClient(event)" class="space-y-4">
                <input type="hidden" id="edit-index" value="">
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">¿Cliente Abierto?</label>
                        <select id="c-abierto" onchange="toggleClientFields()" class="w-full bg-slate-900 border border-slate-700 rounded p-2.5 text-sm text-slate-200">
                            <option value="SÍ">SÍ</option>
                            <option value="NO">NO</option>
                        </select>
                    </div>
                    
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Nombre del Cliente</label>
                        <input type="text" id="c-nombre" required placeholder="Ej. Mini Super Alex" class="w-full bg-slate-900 border border-slate-700 rounded p-2.5 text-sm text-slate-200">
                    </div>

                    <div id="wrapper-tipo-cierre" style="display: none;">
                        <label class="block text-xs text-amber-400 mb-1 font-bold">Tipo Cierre (Si está cerrado)</label>
                        <input type="text" id="c-tipo-cierre" placeholder="Ej. Solo esta visita / Vacaciones" class="w-full bg-slate-900 border border-slate-700 rounded p-2.5 text-sm text-slate-200">
                    </div>

                    <div class="conditional-field">
                        <label class="block text-xs text-slate-400 mb-1">Teléfono</label>
                        <input type="tel" id="c-telefono" placeholder="Ej. 6641234567" class="w-full bg-slate-900 border border-slate-700 rounded p-2.5 text-sm text-slate-200">
                    </div>

                    <div class="conditional-field">
                        <label class="block text-xs text-slate-400 mb-1">¿Quién Recibe?</label>
                        <input type="text" id="c-recibe" placeholder="Persona que atiende" class="w-full bg-slate-900 border border-slate-700 rounded p-2.5 text-sm text-slate-200">
                    </div>

                    <div class="conditional-field">
                        <label class="block text-xs text-slate-400 mb-1">Segmento de Cliente</label>
                        <select id="c-segmento" class="w-full bg-slate-900 border border-slate-700 rounded p-2.5 text-sm text-slate-200">
                            <option value="Tipo A">Tipo A: Cobro, pasillos, refis y carnicería</option>
                            <option value="Tipo B">Tipo B: Pasillos y refrigeradores</option>
                            <option value="Tipo C">Tipo C: Solo exhibición básica</option>
                        </select>
                    </div>

                    <div class="conditional-field">
                        <label class="block text-xs text-slate-400 mb-1">Impacto de Prioridades</label>
                        <select id="c-impacto" class="w-full bg-slate-900 border border-slate-700 rounded p-2.5 text-sm text-slate-200">
                            <option value="SÍ">SÍ</option>
                            <option value="NO">NO</option>
                        </select>
                    </div>

                    <!-- AQUÍ SE CORRIGIÓ EL SELECTOR DE COMPRA EFECTIVA Y MOTIVO -->
                    <div class="conditional-field">
                        <label class="block text-xs text-slate-400 mb-1">¿Compra Efectiva?</label>
                        <select id="c-compra" onchange="toggleMotivoNoCompra()" class="w-full bg-slate-900 border border-slate-700 rounded p-2.5 text-sm text-slate-200">
                            <option value="SÍ">SÍ</option>
                            <option value="NO">NO</option>
                        </select>
                    </div>

                    <div class="conditional-field" id="wrapper-motivo-compra" style="display: none;">
                        <label class="block text-xs text-amber-400 mb-1 font-bold">Motivo No Compra</label>
                        <select id="c-motivo-no-compra" class="w-full bg-slate-900 border border-slate-700 rounded p-2.5 text-sm text-slate-200">
                            <option value="">Seleccione Motivo</option>
                            <option value="Sin dinero">Sin dinero</option>
                            <option value="No está el encargado">No está el encargado</option>
                            <option value="Con inventario">Con inventario</option>
                        </select>
                    </div>
                </div>

                <div class="conditional-field grid grid-cols-1 md:grid-cols-2 gap-4 pt-2">
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Códigos sin Impactar / Comentarios</label>
                        <textarea id="c-codigos" rows="2" class="w-full bg-slate-900 border border-slate-700 rounded p-2.5 text-sm text-slate-200"></textarea>
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Notas de Auditoría</label>
                        <textarea id="c-notas" rows="2" class="w-full bg-slate-900 border border-slate-700 rounded p-2.5 text-sm text-slate-200"></textarea>
                    </div>
                </div>

                <div class="bg-slate-900 border border-slate-700 p-3 rounded-lg">
                    <label class="block text-xs text-amber-400 mb-1 font-bold"><i class="fa-solid fa-camera"></i> Foto de Fachada</label>
                    <input type="file" id="c-foto" accept="image/*" capture="environment" onchange="previewImage(event)" class="w-full text-xs text-slate-400">
                    <img id="foto-preview" class="w-32 h-32 object-cover mt-2 rounded border border-slate-600 hidden">
                </div>

                <div class="pt-4 flex justify-end">
                    <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-6 py-2.5 rounded-lg text-sm">
                        <i class="fa-solid fa-floppy-disk"></i> Guardar Cliente
                    </button>
                </div>
            </form>
        </div>

        <!-- TAB 2: SUPERVISION -->
        <div id="tab-supervision" class="tab-content hidden bg-slate-800 border border-slate-700 rounded-xl p-6 shadow-xl">
            <h2 class="text-lg font-semibold text-blue-400 mb-4 flex items-center gap-2">
                <i class="fa-solid fa-clipboard-list"></i> 3. Supervisión y Evaluación (10 Pasos)
            </h2>
            <div class="mb-6">
                <select id="supervision-client-select" class="w-full bg-slate-900 border border-slate-600 rounded p-2.5 text-sm text-slate-200">
                    <option value="">-- Seleccione un cliente --</option>
                </select>
            </div>
            <form id="supervision-form" onsubmit="submitSupervision(event)">
                <div id="checklist-container" class="grid grid-cols-1 md:grid-cols-2 gap-3 mb-4"></div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs text-slate-300 mb-1 font-semibold">Firma Asesor</label>
                        <canvas id="asesor-sig-pad" class="signature-pad w-full h-32"></canvas>
                    </div>
                    <div>
                        <label class="block text-xs text-slate-300 mb-1 font-semibold">Firma Supervisor</label>
                        <canvas id="supervisor-sig-pad" class="signature-pad w-full h-32"></canvas>
                    </div>
                </div>
                <div class="mt-4 text-right">
                    <button type="submit" class="bg-emerald-600 hover:bg-emerald-700 text-white px-6 py-2 rounded-lg text-sm">Finalizar Supervisión</button>
                </div>
            </form>
        </div>

        <!-- TAB 3: MAPA -->
        <div id="tab-mapa" class="tab-content hidden bg-slate-800 border border-slate-700 rounded-xl p-6 shadow-xl">
            <h2 class="text-lg font-semibold text-blue-400 mb-4"><i class="fa-solid fa-map"></i> 4. Mapa Interactivo</h2>
            <div id="map"></div>
        </div>

        <!-- TAB 4: REPORTE -->
        <div id="tab-historial" class="tab-content hidden bg-slate-800 border border-slate-700 rounded-xl p-6 shadow-xl print-container">
            <h2 class="text-lg font-semibold text-blue-400 mb-4 no-print"><i class="fa-solid fa-chart-line"></i> Reporte y Métricas</h2>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
                <div class="bg-slate-900 p-4 rounded-xl border border-slate-700"><p class="text-xs text-slate-400">Total Visitas</p><p id="metric-total" class="text-2xl font-bold text-white">0</p></div>
                <div class="bg-slate-900 p-4 rounded-xl border border-slate-700"><p class="text-xs text-slate-400">Compra Efectiva</p><p id="metric-compra" class="text-2xl font-bold text-amber-400">0%</p></div>
            </div>
            <div id="client-history-list" class="space-y-3"></div>
        </div>

    </main>

    <!-- NAVEGACIÓN INFERIOR (BARRA FIJA) -->
    <nav class="no-print fixed bottom-0 inset-x-0 bg-slate-800/95 border-t border-slate-700 py-2 px-4 shadow-2xl z-50">
        <div class="max-w-md mx-auto grid grid-cols-4 gap-1">
            <button onclick="switchTab('tab-clientes')" class="nav-tab-btn text-blue-400 flex flex-col items-center p-2 rounded-xl">
                <i class="fa-solid fa-user-plus mb-1"></i><span class="text-[10px]">Clientes</span>
            </button>
            <button onclick="switchTab('tab-supervision')" class="nav-tab-btn text-slate-400 flex flex-col items-center p-2 rounded-xl">
                <i class="fa-solid fa-clipboard-check mb-1"></i><span class="text-[10px]">Supervisión</span>
            </button>
            <button onclick="switchTab('tab-mapa')" class="nav-tab-btn text-slate-400 flex flex-col items-center p-2 rounded-xl">
                <i class="fa-solid fa-map-location-dot mb-1"></i><span class="text-[10px]">Mapa</span>
            </button>
            <button onclick="switchTab('tab-historial')" class="nav-tab-btn text-slate-400 flex flex-col items-center p-2 rounded-xl">
                <i class="fa-solid fa-chart-line mb-1"></i><span class="text-[10px]">Reporte</span>
            </button>
        </div>
    </nav>

    <script>
        // --- NAVEGACIÓN ---
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.add('hidden'));
            document.getElementById(tabId).classList.remove('hidden');
            
            document.querySelectorAll('.nav-tab-btn').forEach(btn => btn.classList.replace('text-blue-400', 'text-slate-400'));
            event.currentTarget.classList.replace('text-slate-400', 'text-blue-400');

            if (tabId === 'tab-mapa' && map) setTimeout(() => map.invalidateSize(), 200);
        }

        // --- RUTAS DINÁMICAS (CORRECCIÓN APLICADA) ---
        function onCedisChange() {
            const cedis = document.getElementById('f-cedis').value;
            const select = document.getElementById('f-ruta');
            select.innerHTML = '<option value="">Seleccione Ruta</option>';
            
            if (cedis) {
                for(let i=1; i<=18; i++) {
                    let num = i.toString().padStart(2, '0');
                    select.innerHTML += `<option value="${num}">Ruta ${num}</option>`;
                }
                for(let i=301; i<=306; i++) {
                    select.innerHTML += `<option value="${i}">Ruta ${i}</option>`;
                }
            } else {
                select.innerHTML = '<option value="">Primero seleccione un CEDIS</option>';
            }
        }

        // --- LÓGICA DE CONDICIONALES CLIENTE ---
        function toggleClientFields() {
            const abierto = document.getElementById('c-abierto').value;
            const condFields = document.querySelectorAll('.conditional-field');
            const wrapperCierre = document.getElementById('wrapper-tipo-cierre');

            if (abierto === 'NO') {
                wrapperCierre.style.display = 'block';
                condFields.forEach(f => f.style.display = 'none');
            } else {
                wrapperCierre.style.display = 'none';
                condFields.forEach(f => f.style.display = 'block');
                toggleMotivoNoCompra(); // Revaluar motivo si está abierto
            }
        }

        // --- LÓGICA DE MOTIVO NO COMPRA (CORRECCIÓN APLICADA) ---
        function toggleMotivoNoCompra() {
            const compra = document.getElementById('c-compra').value;
            const wrapper = document.getElementById('wrapper-motivo-compra');
            const selectMotivo = document.getElementById('c-motivo-no-compra');

            // Solo se muestra si dicen que NO compraron
            if (compra === 'NO') {
                wrapper.style.display = 'block';
                selectMotivo.required = true;
            } else {
                wrapper.style.display = 'none';
                selectMotivo.required = false;
                selectMotivo.value = '';
            }
        }

        // --- SISTEMA BASE (DATOS, MAPA, FIRMAS) ---
        let state = { clientes: [] };
        let map = null;

        window.onload = () => {
            initMap();
            initChecklist();
            initCanvas('asesor-sig-pad');
            initCanvas('supervisor-sig-pad');
            toggleClientFields(); // Iniciar visibilidad correcta
        };

        function registerClient(e) {
            e.preventDefault();
            const cliente = {
                nombre: document.getElementById('c-nombre').value,
                abierto: document.getElementById('c-abierto').value,
                compra: document.getElementById('c-compra').value,
                lat: 19.4326 + (Math.random() - 0.5)*0.02,
                lng: -99.1332 + (Math.random() - 0.5)*0.02
            };
            state.clientes.push(cliente);
            alert("Cliente guardado");
            document.getElementById('client-form').reset();
            toggleClientFields(); // Restablece condicionales
            actualizarUI();
        }

        function actualizarUI() {
            // Actualiza Lista
            document.getElementById('supervision-client-select').innerHTML = state.clientes.map((c, i) => `<option value="${i}">${c.nombre}</option>`).join('');
            document.getElementById('client-history-list').innerHTML = state.clientes.map(c => `<div class="bg-slate-900 p-3 rounded mb-2 text-sm">${c.nombre} - ${c.abierto} - Compra: ${c.compra}</div>`).join('');
            document.getElementById('metric-total').textContent = state.clientes.length;
            
            // Actualiza Mapa
            state.clientes.forEach(c => L.marker([c.lat, c.lng]).addTo(map).bindPopup(c.nombre));
        }

        function initMap() {
            map = L.map('map').setView([19.4326, -99.1332], 13);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        }

        function initChecklist() {
            const pasos = ["1. ID cliente", "2. Saludo", "3. ID marcas", "4. Stock", "5. Caducidades", "6. Impulso", "7. Promos", "8. Venta", "9. Objeciones", "10. Despedida"];
            document.getElementById('checklist-container').innerHTML = pasos.map(p => `<div class="flex justify-between bg-slate-900 p-2 text-xs text-slate-300"><span>${p}</span><select class="bg-slate-800 text-white rounded"><option>CUMPLE</option><option>NO CUMPLE</option></select></div>`).join('');
        }

        function initCanvas(id) {
            const c = document.getElementById(id);
            const ctx = c.getContext('2d');
            let drawing = false;
            c.addEventListener('mousedown', e => { drawing = true; ctx.moveTo(e.offsetX, e.offsetY); });
            c.addEventListener('mousemove', e => { if(drawing) { ctx.lineTo(e.offsetX, e.offsetY); ctx.stroke(); ctx.strokeStyle='white'; }});
            c.addEventListener('mouseup', () => drawing = false);
        }

        function saveRouteData() {} // Placeholder para persistencia futura
        function previewImage() { document.getElementById('foto-preview').classList.remove('hidden'); }
        function submitSupervision(e) { e.preventDefault(); alert("Supervisión finalizada"); }
    </script>
</body>
</html>
