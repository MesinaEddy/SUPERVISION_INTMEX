<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUPERVISION INTMEX - Panel Ejecutivo Gerencial</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        #map { height: 420px; border-radius: 0.5rem; cursor: crosshair; }
        .signature-pad { border: 2px dashed #4b5563; background: #1f2937; border-radius: 0.5rem; cursor: crosshair; touch-action: none; width: 100%; height: 110px; }
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: #1e293b;
            border-top: 1px solid #334155;
            z-index: 1050;
            display: flex;
            justify-content: space-around;
            padding: 8px 4px;
            box-shadow: 0 -4px 6px -1px rgba(0, 0, 0, 0.3);
        }
        @media print {
            body { background: white !important; color: black !important; }
            .no-print, header, nav, button, .bottom-nav { display: none !important; }
            .print-container { background: white !important; color: black !important; border: none !important; box-shadow: none !important; width: 100% !important; }
            .print-black { color: black !important; border-color: #cbd5e1 !important; background: #f8fafc !important; }
            .print-img { max-width: 120px !important; max-height: 120px !important; border: 1px solid #94a3b8 !important; }
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen pb-24">

    <!-- Header con Logotipo e Identidad -->
    <header class="no-print bg-slate-800 border-b border-slate-700 py-3 px-6 shadow-md">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 rounded-full bg-blue-600 flex items-center justify-center text-white font-bold text-lg shadow border-2 border-blue-400 overflow-hidden flex-shrink-0">
                    <img src="logo.png" alt="INTMEX Logo" class="w-full h-full object-cover" onerror="this.onerror=null; this.parentNode.innerHTML='INT';">
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-wide text-blue-400">SUPERVISION INTMEX</h1>
                    <p class="text-xs text-slate-400">Panel Ejecutivo Gerencial | Control de Campo y Auditoría</p>
                </div>
            </div>
            <div class="flex items-center gap-2 mt-2 md:mt-0 flex-wrap">
                <button onclick="toggleRescuePanel()" class="bg-amber-600 hover:bg-amber-700 text-white text-xs font-semibold px-3 py-1.5 rounded-lg shadow transition flex items-center gap-1.5">
                    <i class="fa-solid fa-wand-magic-sparkles"></i> Panel de Rescate
                </button>
                <div id="gps-status" class="bg-emerald-900/60 border border-emerald-500 text-emerald-300 text-xs px-3 py-1.5 rounded-full flex items-center gap-2">
                    <i class="fa-solid fa-location-dot animate-pulse"></i>
                    <span id="gps-text">GPS Activo (Calibrado)</span>
                </div>
            </div>
        </div>
    </header>

    <!-- PANEL DE RESCATE -->
    <div id="rescue-panel" class="no-print max-w-7xl mx-auto px-4 mt-4 hidden">
        <div class="bg-amber-950/80 border border-amber-600 rounded-xl p-4 shadow-xl">
            <h3 class="text-sm font-bold text-amber-300 mb-2 flex items-center gap-2">
                <i class="fa-solid fa-triangle-exclamation"></i> Centro de Recuperación y Exportación
            </h3>
            <div class="flex flex-wrap gap-2">
                <button onclick="exportBackup()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs px-3 py-2 rounded font-medium">
                    <i class="fa-solid fa-download"></i> Descargar Respaldo JSON
                </button>
                <button onclick="exportToCSV()" class="bg-blue-600 hover:bg-blue-700 text-white text-xs px-3 py-2 rounded font-medium">
                    <i class="fa-solid fa-file-excel"></i> Exportar Excel / My Maps (CSV)
                </button>
                <label class="bg-purple-600 hover:bg-purple-700 text-white text-xs px-3 py-2 rounded font-medium cursor-pointer">
                    <i class="fa-solid fa-upload"></i> Cargar Respaldo JSON <input type="file" accept=".json" onchange="importBackup(event)" class="hidden">
                </label>
            </div>
        </div>
    </div>

    <!-- 1. DATOS DE RUTA, ASESOR Y SUPERVISOR -->
    <section class="no-print max-w-7xl mx-auto px-4 mt-6">
        <div class="bg-slate-800/90 border border-slate-700 rounded-xl p-4 shadow-lg">
            <div class="flex justify-between items-center mb-3 border-b border-slate-700 pb-2">
                <h2 class="text-sm font-semibold text-blue-300 uppercase tracking-wider flex items-center gap-2">
                    <i class="fa-solid fa-id-card"></i> 1. Datos de Ruta, Asesor y Supervisor
                </h2>
                <span class="text-xs text-slate-400 bg-slate-700 px-2 py-0.5 rounded">Autoguardado activo</span>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-6 gap-3">
                <div>
                    <label class="block text-xs text-slate-400 mb-1">CEDIS</label>
                    <select id="f-cedis" onchange="onCedisChange()" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-slate-200 outline-none">
                        <option value="">Seleccione CEDIS</option>
                        <option value="TIJ">TIJUANA</option>
                        <option value="MXLI">MEXICALI</option>
                        <option value="HILLO">HERMOSILLO</option>
                        <option value="MOC">MOCHIS</option>
                        <option value="CUL">CULIACAN</option>
                        <option value="MZT">MAZATLAN</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Ruta</label>
                    <select id="f-ruta" onchange="saveRouteData()" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-slate-200 outline-none">
                        <option value="">Primero seleccione un CEDIS</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Nombre del Asesor</label>
                    <input type="text" id="f-asesor" placeholder="Ej. Carlos Gutiérrez" oninput="saveRouteData()" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-slate-200 outline-none">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Nombre del Supervisor</label>
                    <input type="text" id="f-supervisor" placeholder="Ej. Roberto Martínez" oninput="saveRouteData()" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-slate-200 outline-none">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Tipo de Ruta</label>
                    <select id="f-tipo-ruta" onchange="saveRouteData()" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-slate-200 outline-none">
                        <option value="Ruta Activa">Ruta Activa</option>
                        <option value="Ruta Nueva">Ruta Nueva</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Motivo de Supervisión</label>
                    <select id="f-objetivo" onchange="saveRouteData()" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-slate-200 outline-none">
                        <option value="">Seleccione Motivo</option>
                        <optgroup label="CAPACITACION">
                            <option value="CAPACITACION: NVO ING">NVO ING</option>
                            <option value="CAPACITACION: REFUERZO">REFUERZO</option>
                        </optgroup>
                        <optgroup label="TERRITORIO">
                            <option value="TERRITORIO: CARGA CTS">CARGA CTS</option>
                            <option value="TERRITORIO: REESTRUCTURA">REESTRUCTURA</option>
                        </optgroup>
                        <optgroup label="VENTA">
                            <option value="VENTA: EFECTIVIDAD VTA">EFECTIVIDAD VTA</option>
                            <option value="VENTA: IMPULSO">IMPULSO</option>
                        </optgroup>
                    </select>
                </div>
            </div>
        </div>
    </section>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 mt-6">
        <!-- TAB 2: REGISTRO DE CLIENTES -->
        <div id="tab-clientes" class="tab-content bg-slate-800 border border-slate-700 rounded-xl p-6 shadow-xl mb-12">
            <h2 id="form-title" class="text-lg font-semibold text-blue-400 mb-4 flex items-center gap-2">
                <i class="fa-solid fa-user-plus"></i> Alta de Cliente en Base de Datos
            </h2>
            <form id="client-form" onsubmit="registerClient(event)" class="space-y-4">
                <input type="hidden" id="edit-index" value="">
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">¿Cliente Abierto?</label>
                        <select id="c-abierto" onchange="toggleClientFields()" class="w-full bg-slate-900 border border-slate-700 rounded p-2.5 text-sm text-slate-200">
                            <option value="SÍ">SÍ</option>
                            <option value="NO">NO</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Nombre del Cliente</label>
                        <input type="text" id="c-nombre" required placeholder="Ej. Mini Super Alex" class="w-full bg-slate-900 border border-slate-700 rounded p-2.5 text-sm text-slate-200">
                    </div>
                    <div id="wrapper-tipo-cierre" style="display: none;">
                        <label class="block text-xs text-amber-400 mb-1 font-bold">Tipo Cierre</label>
                        <input type="text" id="c-tipo-cierre" placeholder="Ej. Solo esta visita / Vacaciones" class="w-full bg-slate-900 border border-slate-700 rounded p-2.5 text-sm text-slate-200">
                    </div>
                    <div class="conditional-field">
                        <label class="block text-xs text-slate-400 mb-1">Teléfono</label>
                        <input type="tel" id="c-telefono" placeholder="Ej. 6641234567" class="w-full bg-slate-900 border border-slate-700 rounded p-2.5 text-sm text-slate-200">
                    </div>
                    <div class="conditional-field">
                        <label class="block text-xs text-slate-400 mb-1">¿Quién Recibe?</label>
                        <input type="text" id="c-recibe" placeholder="Persona que atiende" class="w-full bg-slate-900 border border-slate-700 rounded p-2.5 text-sm text-slate-200">
                    </div>
                    <div class="conditional-field">
                        <label class="block text-xs text-slate-400 mb-1">Segmento de Cliente</label>
                        <select id="c-segmento" class="w-full bg-slate-900 border border-slate-700 rounded p-2.5 text-sm text-slate-200">
                            <option value="Tipo A">Tipo A: Cobro, pasillos, refis y carnicería</option>
                            <option value="Tipo B">Tipo B: Pasillos y refrigeradores</option>
                            <option value="Tipo C">Tipo C: Solo exhibición básica</option>
                            <option value="Tipo D">Tipo D: Fuera de ruta / Otro</option>
                        </select>
                    </div>
                    <div class="conditional-field">
                        <label class="block text-xs text-slate-400 mb-1">Impacto de Prioridades</label>
                        <select id="c-impacto" class="w-full bg-slate-900 border border-slate-700 rounded p-2.5 text-sm text-slate-200">
                            <option value="SÍ">SÍ</option>
                            <option value="NO">NO</option>
                        </select>
                    </div>
                    <div class="conditional-field">
                        <label class="block text-xs text-slate-400 mb-1">¿Compra Efectiva?</label>
                        <select id="c-compra" onchange="toggleClientFields
